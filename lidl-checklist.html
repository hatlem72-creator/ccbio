<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0050aa">
<title>Lidl Nijkerk — boodschappenlijst</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --card-checked: #13261c;
    --text: #f0f4f8;
    --muted: #8b9bb0;
    --accent: #0050aa;
    --accent2: #ffd500;
    --ok: #2ecc71;
    --border: #2a3648;
    --tap: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 24px; }

  header.sticky {
    position: sticky;
    top: 0;
    z-index: 50;
    background: linear-gradient(180deg, #0a3d7a 0%, var(--accent) 100%);
    color: #fff;
    padding: 12px 14px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: .01em;
  }
  header .sub {
    font-size: .78rem;
    opacity: .85;
    margin-top: 2px;
  }
  .totals {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .tot {
    background: rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .tot .label {
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    opacity: .8;
  }
  .tot .val {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .tot.sel .val { color: var(--accent2); }
  .tot.rest .val { color: #a8e6cf; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 14px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  /* toolbar sticks under header — adjust via JS scroll or keep below sticky header */
  header.sticky + .toolbar { position: sticky; top: auto; }

  button.btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: .9rem;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    min-height: var(--tap);
    cursor: pointer;
    flex: 0 0 auto;
  }
  button.btn:active { transform: scale(.97); background: #243044; }
  button.btn.primary {
    background: var(--accent);
    border-color: #0066cc;
    color: #fff;
  }

  .search-wrap {
    flex: 1 1 100%;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    min-height: var(--tap);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px 10px 40px;
    font-size: 1rem;
  }
  .search-wrap::before {
    content: "⌕";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1.1rem;
    pointer-events: none;
  }
  .search-wrap input::placeholder { color: var(--muted); }

  .cats {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 14px 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: .78rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    min-height: 36px;
    cursor: pointer;
  }
  .chip.active {
    background: var(--accent2);
    color: #111;
    border-color: var(--accent2);
  }

  .meta {
    padding: 4px 14px 8px;
    font-size: .8rem;
    color: var(--muted);
  }

  ul#list {
    list-style: none;
    padding: 0 10px 40px;
  }
  li.row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    min-height: 60px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
    user-select: none;
  }
  li.row.checked {
    background: var(--card-checked);
    border-color: #1e4a30;
  }
  li.row.checked .name { text-decoration: line-through; opacity: .7; }
  li.row.hidden { display: none; }

  .check {
    flex: 0 0 var(--tap);
    width: var(--tap);
    height: var(--tap);
    border-radius: 12px;
    border: 2px solid #4a5a70;
    background: #0f1419;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: transparent;
    transition: all .12s;
  }
  li.row.checked .check {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }
  .check::after { content: "✓"; }

  .info { flex: 1 1 auto; min-width: 0; }
  .name {
    font-weight: 600;
    font-size: .98rem;
    word-break: break-word;
  }
  .detail {
    font-size: .78rem;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    display: inline-block;
    background: rgba(255,213,0,.12);
    color: #e6c200;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: .7rem;
    font-weight: 600;
    text-transform: uppercase;
  }
  .price {
    flex: 0 0 auto;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    color: var(--accent2);
    white-space: nowrap;
  }
  li.row.checked .price { color: var(--ok); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    display: none;
  }
  .empty.show { display: block; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .75rem;
    padding: 8px 14px 24px;
  }
</style>
</head>
<body>
<header class="sticky">
  <h1>Lidl Nijkerk — boodschappenlijst</h1>
  <div class="sub">Amperestraat 5 · 96 artikelen · Bon €223,57</div>
  <div class="totals">
    <div class="tot sel">
      <div class="label">Geselecteerd</div>
      <div class="val" id="selTotal">€0,00</div>
    </div>
    <div class="tot rest">
      <div class="label">Rest</div>
      <div class="val" id="restTotal">€223,57</div>
    </div>
    <div class="tot">
      <div class="label">Bon</div>
      <div class="val">€223,57</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <button type="button" class="btn primary" id="btnAll">Alles aan</button>
  <button type="button" class="btn" id="btnNone">Alles uit</button>
  <div class="search-wrap">
    <input type="search" id="search" placeholder="Zoeken…" autocomplete="off" enterkeyhint="search">
  </div>
</div>

<div class="cats" id="cats"></div>
<div class="meta" id="meta">0 van 68 geselecteerd</div>

<ul id="list"></ul>
<div class="empty" id="empty">Geen items gevonden</div>
<footer>Offline · vinkjes worden bewaard op dit apparaat</footer>

  {id:63,name:"Warme sauzen",qty:"2×",note:"prijsverlaging",price:2.74,category:"sauzen"},
  {id:64,name:"Chocolade bonbons",qty:"1",note:"",price:2.59,category:"snoep"},
  {id:65,name:"Diamond frisdrank",qty:"2×",note:"",price:2.14,category:"drank"},
  {id:66,name:"Losse fles PET groo",qty:"2×",note:"statiegeld",price:0.50,category:"statiegeld"},
  {id:67,name:"Diamond frisdrank",qty:"2×",note:"",price:2.14,category:"drank"},
  {id:68,name:"Losse fles PET groo",qty:"2×",note:"statiegeld",price:0.50,category:"statiegeld"}
];

function euro(n) {
  return "€" + n.toFixed(2).replace(".", ",");
}

function loadChecked() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return new Set();
    const arr = JSON.parse(raw);
    return new Set(Array.isArray(arr) ? arr.map(Number) : []);
  } catch (e) {
    return new Set();
  }
}

function saveChecked(set) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
}

const checked = loadChecked();
let filterCat = "alles";
let filterQ = "";

const listEl = document.getElementById("list");
const selEl = document.getElementById("selTotal");
const restEl = document.getElementById("restTotal");
const metaEl = document.getElementById("meta");
const emptyEl = document.getElementById("empty");
const catsEl = document.getElementById("cats");

const categories = ["alles", ...[...new Set(ITEMS.map(i => i.category))].sort()];

function renderCats() {
  catsEl.innerHTML = "";
  categories.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (c === filterCat ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", () => {
      filterCat = c;
      renderCats();
      applyFilter();
    });
    catsEl.appendChild(b);
  });
}

function renderList() {
  listEl.innerHTML = "";
  ITEMS.forEach(item => {
    const li = document.createElement("li");
    li.className = "row" + (checked.has(item.id) ? " checked" : "");
    li.dataset.id = item.id;
    li.dataset.cat = item.category;
    li.dataset.name = (item.name + " " + (item.note || "") + " " + item.category).toLowerCase();

    const bits = [];
    if (item.qty && item.qty !== "1") bits.push(item.qty);
    if (item.note) bits.push(item.note);
    bits.push('<span class="tag">' + item.category + "</span>");

    li.innerHTML =
      '<div class="check" aria-hidden="true"></div>' +
      '<div class="info"><div class="name">' + escapeHtml(item.name) + "</div>" +
      '<div class="detail">' + bits.join(" · ") + "</div></div>" +
      '<div class="price">' + euro(item.price) + "</div>";

    li.addEventListener("click", () => toggle(item.id));
    listEl.appendChild(li);
  });
  applyFilter();
  updateTotals();
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function toggle(id) {
  if (checked.has(id)) checked.delete(id);
  else checked.add(id);
  saveChecked(checked);
  const li = listEl.querySelector('li[data-id="' + id + '"]');
  if (li) li.classList.toggle("checked", checked.has(id));
  updateTotals();
}

function updateTotals() {
  let sel = 0;
  let n = 0;
  ITEMS.forEach(item => {
    if (checked.has(item.id)) {
      sel += item.price;
      n++;
    }
  });
  // cents-safe
  sel = Math.round(sel * 100) / 100;
  const rest = Math.round((BON - sel) * 100) / 100;
  selEl.textContent = euro(sel);
  restEl.textContent = euro(rest);
  metaEl.textContent = n + " van " + ITEMS.length + " geselecteerd · " + euro(sel);
}

function applyFilter() {
  const q = filterQ.trim().toLowerCase();
  let visible = 0;
  listEl.querySelectorAll("li.row").forEach(li => {
    const catOk = filterCat === "alles" || li.dataset.cat === filterCat;
    const qOk = !q || li.dataset.name.includes(q);
    const show = catOk && qOk;
    li.classList.toggle("hidden", !show);
    if (show) visible++;
  });
  emptyEl.classList.toggle("show", visible === 0);
}

document.getElementById("btnAll").addEventListener("click", () => {
  ITEMS.forEach(i => checked.add(i.id));
  saveChecked(checked);
  listEl.querySelectorAll("li.row").forEach(li => li.classList.add("checked"));
  updateTotals();
});

document.getElementById("btnNone").addEventListener("click", () => {
  checked.clear();
  saveChecked(checked);
  listEl.querySelectorAll("li.row").forEach(li => li.classList.remove("checked"));
  updateTotals();
});

document.getElementById("search").addEventListener("input", e => {
  filterQ = e.target.value;
  applyFilter();
});

// Self-check: sum of all prices must equal BON
(function selfCheck() {
  const cents = ITEMS.reduce((a, i) => a + Math.round(i.price * 100), 0);
  if (cents !== Math.round(BON * 100)) {
    console.error("SUM MISMATCH", cents / 100, BON);
  } else {
    console.log("OK: " + ITEMS.length + " items = €" + BON.toFixed(2));
  }
})();

renderCats();
renderList();
</script>
</body>
</html>
