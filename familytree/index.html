<!doctype html><html lang="en" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate">
<title>Hatlem Olsen — Family History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--ink:#1f1d1a;--mute:#7a736a;--line:#e2dcd2;--acc:#8a6a3b;--card:#fffdf9;--prob:#b08a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.65 Inter,system-ui,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
nav{position:sticky;top:0;z-index:5;background:rgba(246,243,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 20px;overflow-x:auto;white-space:nowrap}
nav .brand{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--ink);margin-right:auto}
nav a.l{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}nav a.l.on{color:var(--ink)}
main{max-width:1100px;margin:auto;padding:0 20px 60px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:400;line-height:1.15}
h1{font-size:clamp(40px,7vw,76px);margin:.2em 0}h2{font-size:34px;margin:1.4em 0 .4em}h3{font-size:24px;margin:.2em 0}
.hero{padding:70px 0 40px;text-align:center}.hero p{max-width:640px;margin:auto;color:var(--mute);font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px;transition:.2s}a.panel:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);text-decoration:none}
.panel .sub{color:var(--mute);font-size:13px;letter-spacing:.1em;text-transform:uppercase}.panel p{color:#4a453f}
.band{height:6px;border-radius:3px;margin-bottom:16px}.olsen{background:linear-gradient(90deg,#3d5a73,#9db4c8)}.hatlem{background:linear-gradient(90deg,#4f6b4a,#a9bf9c)}.henne{background:linear-gradient(90deg,#8a6a3b,#d6c09a)}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;padding:2px 9px;border-radius:20px;border:1px solid}
.b-fam{color:#4f6b4a;border-color:#a9bf9c}.b-doc{color:#3d5a73;border-color:#9db4c8}.b-prob{color:var(--prob);border-color:var(--prob)}.b-living{color:var(--mute);border-color:var(--line)}
/* tree */
.tree{overflow-x:auto;padding:20px 0}.gens{display:flex;flex-direction:column;gap:26px;min-width:max-content}
.gen{display:flex;gap:12px;justify-content:center;align-items:stretch}.glbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.pc{width:170px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c,#ccc);border-radius:3px;padding:10px 12px;font-size:13px;color:var(--ink);display:block}
.pc:hover{text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.08)}.pc b{font-family:"Cormorant Garamond",serif;font-size:17px;font-weight:600;display:block;line-height:1.15}.pc span{color:var(--mute);font-size:12px}
.pc.l-olsen{--c:#3d5a73}.pc.l-hatlem{--c:#4f6b4a}.pc.l-henne{--c:#8a6a3b}
.timeline{border-left:1px solid var(--line);margin:20px 0 0 8px;padding-left:22px}.ev{position:relative;margin-bottom:18px}.ev:before{content:"";position:absolute;left:-27px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.ev .y{font-family:"Cormorant Garamond",serif;font-size:22px;margin-right:10px}.ev .src{font-size:12px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}.facts div{background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:3px;font-size:14px}.facts small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
ul.src li{margin-bottom:6px;font-size:14px}.note{background:#efe9df;padding:14px 18px;border-radius:3px;font-size:14px;color:#4a453f}
footer{text-align:center;color:var(--mute);font-size:12px;padding:30px;border-top:1px solid var(--line)}
@media(max-width:600px){.pc{width:140px}.hero{padding:40px 0 20px}}
</style></head><body class="notranslate">
<nav><div class="in"><a class="brand" href="#/">Hatlem · Olsen</a><a class="l" href="#/tree">Tree</a><a class="l" href="#/line/olsen">Olsen</a><a class="l" href="#/line/hatlem">Hatlem</a><a class="l" href="#/line/henne">Henne</a><a class="l" href="#/places">Places</a><a class="l" href="#/sources">Sources</a></div></nav>
<main id="app"></main>
<footer>Family history of Gaute Hatlem Olsen · Records from Digitalarkivet (National Archives of Norway) · Only names are shown for living people · Updated October 2026</footer>
<script src="data.js"></script>
<script>
const BL={fam:["Confirmed by family","b-fam"],doc:["Documented","b-doc"],prob:["Probable","b-prob"],living:["Confirmed by family · living","b-living"]};
const badge=s=>`<span class="badge ${BL[s][1]}">${BL[s][0]}</span>`;
const yrs=p=>p.st=="living"?"":[(p.b||"").match(/\d{4}/),(p.d||"").match(/\d{4}/)].map(x=>x?x[0]:"").join("–").replace(/^–$/,"").replace(/–$/,p.b?"":"");
const card=id=>{const p=P[id];return `<a class="pc l-${p.line}" href="#/p/${id}"><b>${p.n}</b><span>${p.role||""}${yrs(p)?" · "+yrs(p):""}</span></a>`};
const srcl=k=>S[k][1]?`<a href="${S[k][1]}" target="_blank" rel="noopener">${S[k][0]}</a>`:`<span>${S[k][0]}</span>`;
const V={
home:()=>`<section class="hero"><div class="eyebrow">A family history</div><h1>Hatlem Olsen</h1><p>Lofoten fishermen and shop clerks, Ålesund bakers and steamship stokers, farmers on the fjords of Sogn and the hills of Fana. All of these roads lead to Bergen. This site follows them back, one record at a time, through the censuses and church books of the National Archives of Norway.</p></section>
<div class="grid">${Object.entries(LINES).map(([k,l])=>`<a class="panel" href="#/line/${k}"><div class="band ${k}"></div><div class="sub">${l.sub}</div><h3>${l.t}</h3><p>${l.txt.slice(0,170)}…</p></a>`).join("")}</div>
<h2>At a glance</h2><div class="facts"><div><small>Generations</small>Eight, back to Dorthea Abelsæt (c. 1748)</div><div><small>Earliest birth found</small>Dorthea Abelsæt, c. 1748</div><div><small>People</small>${Object.keys(P).length}</div><div><small>Records cited</small>${Object.keys(S).length}</div></div>
<h2>Stories</h2><a class="panel" href="#/line/hatlem/america" style="display:block"><div class="sub">1890–1928</div><h3>The Hatlem family in America</h3><p>Hans Hatlem's journeys of 1890 and 1912, and Harald's years in Chicago as a printer.</p></a>
<p style="text-align:center;margin-top:30px"><a href="#/tree">Explore the family tree →</a></p>`,
tree:()=>{const G=[["5th great-grandparents",["dorthea"]],["4th great-grandparents",["jorgen","christine"]],["3rd great-grandparents",["kristofer","johanneJ","hansG","jensL","ingeborgS","oleM","kariJ","johannesO","larsOH","kariH"]],["2nd great-grandparents",["martinus","johan","karen","hanss","petrine","hansJen","halfri","paulO","kariO","larsJ","caecilie","pederL","emilie","jakobR","ingeborgT"]],["Great-grandparents",["anton","elise","larsP","eline","hansj","ingeborgH","lars","marta"]],["Great-grandfather Hans's siblings",["anders","andrew","trine","annemarie"]],["Grandparents",["arne99","ingeborgO","harald","klara"]],["Grandfather Harald's siblings and cousins",["petrineH","henninge","hjalmar","herman","arthur","hansH","vanH","florence"]],["Parents",["arne46","martha"]],["Father's siblings",["olaf","else_"]],["Mother's siblings",["dag","liv"]],["Siblings",["anne","gaute","claus"]],["Nieces & nephews",["hedda","anna","christoffer","leander"]]];
 return `<h2>The family tree</h2><p style="color:var(--mute)">Tap anyone to see their story and sources. Colours show the family line: <span style="color:#3d5a73">Olsen/Stub</span>, <span style="color:#4f6b4a">Hatlem</span>, <span style="color:#8a6a3b">Henne/Nøttveit</span>.</p><div class="tree"><div class="gens">${G.map(([l,ids])=>`<div class="gen">${l?`<div class="glbl">${l}</div>`:""}${ids.map(card).join("")}</div>`).join("")}</div></div>`},
line:k=>{const l=LINES[k];return `<section class="hero" style="text-align:left;padding-bottom:10px"><div class="band ${k}" style="width:80px"></div><div class="eyebrow">${l.sub}</div><h1>${l.t}</h1></section><p style="font-size:17px;max-width:760px">${l.txt}</p>${l.story?`<section id="${l.story.id}"><h2>${l.story.t}</h2>${l.story.paras.map(([t,src])=>`<p style="font-size:17px;max-width:760px">${t}${src?`<span class="src" style="display:block;font-size:13px">${src.map(srcl).join(" · ")}</span>`:""}</p>`).join("")}${l.story.img?`<figure style="margin:10px 0 24px;max-width:560px"><a href="${l.story.img[0]}" target="_blank"><img src="${l.story.img[0]}" alt="${l.story.img[1]}" loading="lazy" style="max-width:100%;border:1px solid #ddd;border-radius:3px"></a><figcaption style="font-size:13px;color:var(--mute);margin-top:6px">${l.story.img[1]}</figcaption></figure>`:""}</section>`:""}<h2>People</h2><div class="grid">${l.ids.map(id=>{const p=P[id];return `<a class="panel" href="#/p/${id}"><div class="sub">${p.role||""}</div><h3>${p.n}</h3><p>${[p.b&&"b. "+p.b,p.d&&"d. "+p.d].filter(Boolean).join(" · ")}</p>${badge(p.st)}</a>`}).join("")}</div>`},
p:id=>{const p=P[id];if(!p)return"<p>Not found.</p>";const kids=Object.entries(P).filter(([k,x])=>(x.par||[]).includes(id)).map(([k])=>k);
 const used=[...new Set((p.ev||[]).flatMap(e=>e[2]||[]))];
 return `<p style="margin-top:24px"><a href="#/tree">← Tree</a>${p.line?` · <a href="#/line/${p.line}">${LINES[p.line].t} line</a>`:""}</p><div class="eyebrow">${p.role||""}</div><h1 style="font-size:clamp(34px,6vw,56px)">${p.n}</h1>${badge(p.st)}
 ${p.st=="living"?`<p class="note">Living person. Only the name is shown, to protect their privacy.</p>`:`<div class="facts">${p.b?`<div><small>Born</small>${p.b}</div>`:""}${p.d?`<div><small>Died</small>${p.d}</div>`:""}</div>`}
 ${p.note?`<p class="note">${p.note}</p>`:""}
 ${(p.par||[]).length?`<h2>Parents</h2><div class="gen" style="justify-content:flex-start;flex-wrap:wrap">${p.par.map(card).join("")}</div>`:""}
 ${(p.sp||[]).length?`<h2>Spouse</h2><div class="gen" style="justify-content:flex-start;flex-wrap:wrap">${p.sp.map(card).join("")}</div>`:""}
 ${kids.length?`<h2>Children in this tree</h2><div class="gen" style="justify-content:flex-start;flex-wrap:wrap">${kids.map(card).join("")}</div>`:""}
 ${(p.docs||[]).length?`<h2>Documents</h2>${p.docs.map(d=>`<figure style="margin:0 0 20px"><a href="${d[0]}" target="_blank"><img src="${d[0]}" alt="${d[1]}" loading="lazy" style="max-width:100%;border:1px solid #ddd;border-radius:3px"></a><figcaption style="font-size:13px;color:var(--mute);margin-top:6px">${d[1]}</figcaption></figure>`).join("")}`:""}
${(p.ev||[]).length?`<h2>Timeline</h2><div class="timeline">${p.ev.map(e=>`<div class="ev"><span class="y">${e[0]}</span>${e[1]}${e[2]?`<div class="src">${e[2].map(srcl).join(" · ")}</div>`:""}</div>`).join("")}</div>`:""}
 ${used.length?`<h2>Sources</h2><ul class="src">${used.map(k=>`<li>${srcl(k)}</li>`).join("")}</ul>`:""}`},
places:()=>`<h2>Places</h2><div class="grid">${PLACES.map(([n,t,ids])=>`<div class="panel"><h3>${n}</h3><p>${t}</p><p style="font-size:13px">${ids.map(i=>`<a href="#/p/${i}">${P[i].n}</a>`).join(" · ")}</p></div>`).join("")}</div>`,
sources:()=>`<h2>Sources</h2><p style="color:var(--mute)">All records are from <a href="https://www.digitalarkivet.no" target="_blank">Digitalarkivet</a>, the National Archives of Norway. Each person is marked <b>Confirmed by family</b>, <b>Documented</b> (a record states the relationship) or <b>Probable</b>.</p><ul class="src">${Object.keys(S).map(k=>`<li>${srcl(k)}</li>`).join("")}</ul>`
};
function route(){const h=location.hash.replace(/^#\/?/,"").split("/");const app=document.getElementById("app");
 app.innerHTML=h[0]=="tree"?V.tree():h[0]=="line"?V.line(h[1]):h[0]=="p"?V.p(h[1]):h[0]=="places"?V.places():h[0]=="sources"?V.sources():V.home();
 document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on",location.hash.startsWith(a.getAttribute("href"))));{const t=h[2]&&document.getElementById(h[2]);t?setTimeout(()=>t.scrollIntoView(),30):scrollTo(0,0)}}
addEventListener("hashchange",route);route();
</script></body></html>
