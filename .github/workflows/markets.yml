name: Update markets data
on:
  schedule: [{cron: "*/20 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: markets, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance
      - run: python markets/fetch.py
      - run: |
          git config user.name "markets-bot"; git config user.email "actions@users.noreply.github.com"
          git add markets/data.json
          git diff --cached --quiet || (git commit -m "Update markets data" && git pull --rebase && git push)
